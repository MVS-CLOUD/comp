# Infisical SecretStore for the `comp` namespace (External Secrets Operator).
# Uses Infisical K8s Auth via a machine identity — NO static secret stored here.
# The InfisicalSecret/auth wiring mirrors the platform's existing external-secrets setup.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: infisical-comp
  namespace: comp
spec:
  provider:
    infisical:
      hostAPI: "[PLACEHOLDER — https://infisical.internal.mvscloud.com/api]"
      auth:
        # Universal Auth machine identity; clientId/clientSecret live in a bootstrap Secret
        # provisioned by the platform (not committed here).
        universalAuthCredentials:
          clientId:
            key: clientId
            namespace: comp
            name: infisical-machine-identity
          clientSecret:
            key: clientSecret
            namespace: comp
            name: infisical-machine-identity
      secretsScope:
        projectSlug: "comp-ai"
        environmentSlug: "prod"
        secretsPath: "/"
---
