{{- if .Values.ingress.enabled }}
# Traefik IngressRoute fronted by Okta forward-auth (platform middleware).
# Mirrors the nemoclaw-prod/bridge oauth2-proxy pattern referenced in HealthOS GAP_MATRIX #1.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ .Values.nameOverride }}-app
  namespace: {{ .Values.namespace }}
spec:
  entryPoints:
    - {{ .Values.ingress.entryPoint }}
  routes:
    - match: Host(`{{ .Values.hosts.app }}`)
      kind: Rule
      services:
        - name: {{ .Values.nameOverride }}-app
          port: 80
      {{- if .Values.ingress.forwardAuth.enabled }}
      middlewares:
        - name: {{ .Values.ingress.forwardAuth.middlewareName }}
          namespace: {{ .Values.ingress.forwardAuth.namespace }}
      {{- end }}
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ .Values.nameOverride }}-portal
  namespace: {{ .Values.namespace }}
spec:
  entryPoints:
    - {{ .Values.ingress.entryPoint }}
  routes:
    - match: Host(`{{ .Values.hosts.portal }}`)
      kind: Rule
      services:
        - name: {{ .Values.nameOverride }}-portal
          port: 80
      {{- if .Values.ingress.forwardAuth.enabled }}
      middlewares:
        - name: {{ .Values.ingress.forwardAuth.middlewareName }}
          namespace: {{ .Values.ingress.forwardAuth.namespace }}
      {{- end }}
  tls: {}
{{- end }}
