apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.nameOverride }}-app
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.nameOverride }}
    app.kubernetes.io/component: app
spec:
  selector:
    app.kubernetes.io/name: {{ .Values.nameOverride }}
    app.kubernetes.io/component: app
  ports:
    - name: http
      port: 80
      targetPort: {{ .Values.app.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.nameOverride }}-portal
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.nameOverride }}
    app.kubernetes.io/component: portal
spec:
  selector:
    app.kubernetes.io/name: {{ .Values.nameOverride }}
    app.kubernetes.io/component: portal
  ports:
    - name: http
      port: 80
      targetPort: {{ .Values.portal.port }}
