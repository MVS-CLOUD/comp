{{- if .Values.externalSecrets.enabled }}
# External Secrets Operator pulls Comp secrets from Infisical into the `comp-secrets` Secret.
# NO secret VALUES are committed — only the key references. Populate values in Infisical project `comp-ai`.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: comp-secrets
  namespace: {{ .Values.namespace }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: comp-secrets
    creationPolicy: Owner
  data:
    # ---- Database (dedicated Neon project mvs-compliance-comp) ----
    - secretKey: DATABASE_URL
      remoteRef: { key: DATABASE_URL }
    # ---- Auth (Better Auth) ----
    - secretKey: AUTH_SECRET
      remoteRef: { key: AUTH_SECRET }
    - secretKey: SECRET_KEY
      remoteRef: { key: SECRET_KEY }
    - secretKey: BETTER_AUTH_SECRET
      remoteRef: { key: BETTER_AUTH_SECRET }
    - secretKey: REVALIDATION_SECRET
      remoteRef: { key: REVALIDATION_SECRET }
    # ---- Email (Resend; compliance notifications only, no PHI) ----
    - secretKey: RESEND_API_KEY
      remoteRef: { key: RESEND_API_KEY }
    - secretKey: RESEND_DOMAIN
      remoteRef: { key: RESEND_DOMAIN }
    - secretKey: RESEND_FROM_SYSTEM
      remoteRef: { key: RESEND_FROM_SYSTEM }
    - secretKey: RESEND_FROM_DEFAULT
      remoteRef: { key: RESEND_FROM_DEFAULT }
    # ---- Workflows ----
    - secretKey: TRIGGER_SECRET_KEY
      remoteRef: { key: TRIGGER_SECRET_KEY }
    # ---- Optional: S3 attachment buckets (KMS-encrypted) ----
    - secretKey: APP_AWS_ACCESS_KEY_ID
      remoteRef: { key: APP_AWS_ACCESS_KEY_ID }
    - secretKey: APP_AWS_SECRET_ACCESS_KEY
      remoteRef: { key: APP_AWS_SECRET_ACCESS_KEY }
    - secretKey: APP_AWS_REGION
      remoteRef: { key: APP_AWS_REGION }
    - secretKey: APP_AWS_BUCKET_NAME
      remoteRef: { key: APP_AWS_BUCKET_NAME }
    # ---- Optional: AI features routed via LiteLLM gateway (not a raw provider key in prod) ----
    - secretKey: OPENAI_API_KEY
      remoteRef: { key: OPENAI_API_KEY }
{{- end }}
